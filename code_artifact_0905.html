<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100가지 모양 불꽃놀이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div class="absolute top-4 left-4 z-10 text-white/80 pointer-events-none drop-shadow-md">
        <h1 class="text-2xl font-bold text-yellow-400">🎆 100가지 모양 불꽃놀이</h1>
        <p class="text-sm mt-1">화면을 클릭하여 소리와 함께 다양한 크기와 모양의 불꽃을 터뜨려보세요!</p>
        <p id="shape-counter" class="text-xs mt-2 text-cyan-300 font-mono">현재 발사된 모양: 일반 원형 파열</p>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <script>
        // Web Audio API 오디오 컨텍스트 설정
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 로켓 발사 휘파람/상승음 효과
        function playLaunchSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5);

                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                // 오디오 재생 오류 방지
            }
        }

        // 웅장한 폭발음 효과 (노이즈 버스트 + 저주파 붐)
        function playExplosionSound(scale) {
            if (!audioCtx) return;
            try {
                const bufferSize = audioCtx.sampleRate * 1.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);

                // 화이트 노이즈 생성
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                // 필터로 묵직한 폭발음 질감 만들기
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(300 * (scale || 1), audioCtx.currentTime);
                filter.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 1.2);

                const gain = audioCtx.createGain();
                const volume = Math.min(0.3 * (scale || 1), 0.6);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
                noise.stop(audioCtx.currentTime + 1.2);
            } catch (e) {}
        }

        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        const shapeCounter = document.getElementById('shape-counter');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const fireworks = [];
        let shapeIndex = 0;

        // 100가지의 다양한 불꽃 형태 생성 함수 정의 배열
        const shapeGenerators = [];

        // 1~20: 기하학적 기본 도형 및 다각형
        for (let i = 3; i <= 22; i++) {
            shapeGenerators.push((angleOffset, count) => {
                const points = [];
                const sides = i;
                for (let j = 0; j < count; j++) {
                    const angle = (j / count) * Math.PI * 2 + angleOffset;
                    const r = 1 + 0.5 * Math.cos(sides * (angle + angleOffset));
                    points.push({ x: Math.cos(angle) * r * 40, y: Math.sin(angle) * r * 40 });
                }
                return points;
            });
        }

        // 21~45: 하트, 별, 꽃잎 등 유기적 모양
        shapeGenerators.push(
            // 하트 모양 1
            () => {
                const pts = [];
                for (let a = 0; a < Math.PI * 2; a += 0.05) {
                    const x = 16 * Math.pow(Math.sin(a), 3);
                    const y = -(13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a));
                    pts.push({ x: x * 3, y: y * 3 });
                }
                return pts;
            },
            // 나비 모양
            () => {
                const pts = [];
                for (let t = 0; t < Math.PI * 2; t += 0.05) {
                    const r = Math.exp(Math.cos(t)) - 2 * Math.cos(4*t) + Math.pow(Math.sin(t/12), 5);
                    pts.push({ x: Math.sin(t) * r * 20, y: -Math.cos(t) * r * 20 });
                }
                return pts;
            },
            // 별 모양 (5망성)
            () => {
                const pts = [];
                for (let i = 0; i < 100; i++) {
                    const a = (i / 100) * Math.PI * 2;
                    const r = (i % 2 === 0) ? 50 : 25;
                    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
                }
                return pts;
            },
            // 나선형 소용돌이
            () => {
                const pts = [];
                for (let i = 0; i < 80; i++) {
                    const angle = i * 0.2;
                    const r = i * 0.8;
                    pts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
                }
                return pts;
            },
            // 토러스 고리형
            () => {
                const pts = [];
                for (let i = 0; i < 80; i++) {
                    const a = (i / 80) * Math.PI * 2;
                    pts.push({ x: Math.cos(a) * 45 + (Math.random() - 0.5)*5, y: Math.sin(a) * 45 + (Math.random() - 0.5)*5 });
                }
                return pts;
            }
        );

        // 나머지 모양들을 프로그래밍 방식으로 100개 채우기
        for (let k = 46; k <= 100; k++) {
            shapeGenerators.push(() => {
                const pts = [];
                const count = 60 + (k % 40);
                const freq1 = (k % 7) + 1;
                const freq2 = (k % 5) + 2;
                for (let i = 0; i < count; i++) {
                    const theta = (i / count) * Math.PI * 2;
                    const r = 30 + 15 * Math.sin(freq1 * theta) * Math.cos(freq2 * theta);
                    pts.push({ x: Math.cos(theta) * r, y: Math.sin(theta) * r });
                }
                return pts;
            });
        }

        class Firework {
            constructor(startX, startY, targetX, targetY, shapeId) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distanceToTarget = Math.hypot(targetX - startX, targetY - startY);
                this.distanceTraveled = 0;
                this.coordinates = [];
                this.coordinateCount = 3;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                this.angle = Math.atan2(targetY - startY, targetX - startX);
                this.speed = 12;
                this.acceleration = 1.05;
                this.brightness = Math.random() * 50 + 50;
                this.shapeId = shapeId;
                this.hue = Math.random() * 360;
                this.scale = Math.random() * 1.3 + 0.5;

                // 발사 사운드 재생
                playLaunchSound();
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);

                this.speed *= this.acceleration;
                const vx = Math.cos(this.angle) * this.speed;
                const vy = Math.sin(this.angle) * this.speed;
                this.distanceTraveled = Math.hypot(this.startX - this.x, this.startY - this.y);

                if (this.distanceTraveled >= this.distanceToTarget) {
                    createParticles(this.targetX, this.targetY, this.hue, this.shapeId, this.scale);
                    // 폭발 사운드 재생 (스케일 크기에 연동)
                    playExplosionSound(this.scale);
                    fireworks.splice(index, 1);
                } else {
                    this.x += vx;
                    this.y += vy;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.hue}, 100%, ${this.brightness}%)`;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, hue, offsetX, offsetY, scale) {
                this.x = x;
                this.y = y;
                this.coordinates = [];
                this.coordinateCount = 5;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                
                const speedMod = (Math.random() * 0.4 + 0.8) * scale;
                this.vx = offsetX * speedMod * 0.12;
                this.vy = offsetY * speedMod * 0.12;
                
                this.vx += (Math.random() - 0.5) * 0.8;
                this.vy += (Math.random() - 0.5) * 0.8;

                this.friction = 0.95;
                this.gravity = 0.3;
                this.hue = hue + Math.random() * 30 - 15;
                this.brightness = Math.random() * 50 + 50;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;

                if (this.alpha <= this.decay) {
                    particles.splice(index, 1);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
                ctx.stroke();
            }
        }

        function createParticles(x, y, hue, shapeId, scale) {
            const generator = shapeGenerators[shapeId % shapeGenerators.length];
            const shapePoints = generator(Math.random() * Math.PI, 100);

            shapePoints.forEach(pt => {
                particles.push(new Particle(x, y, hue, pt.x, pt.y, scale));
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let i = fireworks.length;
            while (i--) {
                fireworks[i].draw();
                fireworks[i].update(i);
            }

            let j = particles.length;
            while (j--) {
                particles[j].draw();
                particles[j].update(j);
            }
        }

        window.addEventListener('click', (e) => {
            if (e.clientY < 90 && e.clientX < 300) return;

            // 오디오 컨텍스트 초기화 (사용자 인터랙션 필수)
            initAudio();

            shapeIndex = (shapeIndex + 1) % 100;
            shapeCounter.innerText = `현재 발사된 모양: #${shapeIndex + 1} 패턴 불꽃`;

            const startX = canvas.width / 2;
            const startY = canvas.height;
            const targetX = e.clientX;
            const targetY = e.clientY;

            fireworks.push(new Firework(startX, startY, targetX, targetY, shapeIndex));
        });

        animate();
    </script>
</body>
</html>
