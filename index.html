<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100가지 모양 불꽃놀이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div class="absolute top-4 left-4 z-10 text-white/80 pointer-events-none drop-shadow-md">
        <h1 class="text-2xl font-bold text-yellow-400">🎆 100가지 모양 불꽃놀이</h1>
        <p class="text-sm mt-1">화면을 클릭하면 다양한 크기와 모양의 불꽃이 웅장하게 터집니다!</p>
        <p id="shape-counter" class="text-xs mt-2 text-cyan-300 font-mono">현재 발사된 모양: 멀티 불꽃 연출</p>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <script>
        // Web Audio API 오디오 컨텍스트 설정
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 로켓 발사 휘파람/상승음 효과 (속도 조절에 맞춰 호흡을 늘림)
        function playLaunchSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.8);

                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.005, audioCtx.currentTime + 0.8);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch (e) {}
        }

        // 웅장한 폭발음 효과 (크기에 따른 볼륨/필터 조절)
        function playExplosionSound(scale) {
            if (!audioCtx) return;
            try {
                const bufferSize = audioCtx.sampleRate * 1.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(250 * scale, audioCtx.currentTime);
                filter.frequency.linearRampToValueAtTime(25, audioCtx.currentTime + 1.5);

                const gain = audioCtx.createGain();
                const volume = Math.min(0.2 * scale, 0.5);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
                noise.stop(audioCtx.currentTime + 1.5);
            } catch (e) {}
        }

        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        const shapeCounter = document.getElementById('shape-counter');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const fireworks = [];
        let shapeIndex = 0;

        // 100가지의 다양한 불꽃 형태 생성 함수 정의 배열
        const shapeGenerators = [];

        // 1~20: 기하학적 기본 도형 및 다각형
        for (let i = 3; i <= 22; i++) {
            shapeGenerators.push((angleOffset, count) => {
                const points = [];
                const sides = i;
                for (let j = 0; j < count; j++) {
                    const angle = (j / count) * Math.PI * 2 + angleOffset;
                    const r = 1 + 0.5 * Math.cos(sides * (angle + angleOffset));
                    points.push({ x: Math.cos(angle) * r * 40, y: Math.sin(angle) * r * 40 });
                }
                return points;
            });
        }

        // 21~45: 하트, 별, 꽃잎 등 유기적 모양
        shapeGenerators.push(
            () => {
                const pts = [];
                for (let a = 0; a < Math.PI * 2; a += 0.05) {
                    const x = 16 * Math.pow(Math.sin(a), 3);
                    const y = -(13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a));
                    pts.push({ x: x * 3, y: y * 3 });
                }
                return pts;
            },
            () => {
                const pts = [];
                for (let t = 0; t < Math.PI * 2; t += 0.05) {
                    const r = Math.exp(Math.cos(t)) - 2 * Math.cos(4*t) + Math.pow(Math.sin(t/12), 5);
                    pts.push({ x: Math.sin(t) * r * 20, y: -Math.cos(t) * r * 20 });
                }
                return pts;
            },
            () => {
                const pts = [];
                for (let i = 0; i < 100; i++) {
                    const a = (i / 100) * Math.PI * 2;
                    const r = (i % 2 === 0) ? 50 : 25;
                    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
                }
                return pts;
            },
            () => {
                const pts = [];
                for (let i = 0; i < 80; i++) {
                    const angle = i * 0.2;
                    const r = i * 0.8;
                    pts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
                }
                return pts;
            },
            () => {
                const pts = [];
                for (let i = 0; i < 80; i++) {
                    const a = (i / 80) * Math.PI * 2;
                    pts.push({ x: Math.cos(a) * 45 + (Math.random() - 0.5)*5, y: Math.sin(a) * 45 + (Math.random() - 0.5)*5 });
                }
                return pts;
            }
        );

        for (let k = 46; k <= 100; k++) {
            shapeGenerators.push(() => {
                const pts = [];
                const count = 60 + (k % 40);
                const freq1 = (k % 7) + 1;
                const freq2 = (k % 5) + 2;
                for (let i = 0; i < count; i++) {
                    const theta = (i / count) * Math.PI * 2;
                    const r = 30 + 15 * Math.sin(freq1 * theta) * Math.cos(freq2 * theta);
                    pts.push({ x: Math.cos(theta) * r, y: Math.sin(theta) * r });
                }
                return pts;
            });
        }

        class Firework {
            constructor(startX, startY, targetX, targetY, shapeId) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distanceToTarget = Math.hypot(targetX - startX, targetY - startY);
                this.distanceTraveled = 0;
                this.coordinates = [];
                this.coordinateCount = 3;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                this.angle = Math.atan2(targetY - startY, targetX - startX);
                
                // [속도 수정] 너무 빠르게 확 올라가지 않고 우아하게 올라가도록 속도를 낮춤
                this.speed = 6 + Math.random() * 2; 
                this.acceleration = 1.03;
                this.brightness = Math.random() * 50 + 50;
                this.shapeId = shapeId;
                this.hue = Math.random() * 360;

                // [크기 수정] 명확히 3단계(작은 크기, 중간 크기, 큰 크기) 중 하나로 선택
                const sizeTiers = [0.6, 1.1, 1.8]; // 소, 중, 대
                this.scale = sizeTiers[Math.floor(Math.random() * sizeTiers.length)];

                playLaunchSound();
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);

                this.speed *= this.acceleration;
                const vx = Math.cos(this.angle) * this.speed;
                const vy = Math.sin(this.angle) * this.speed;
                this.distanceTraveled = Math.hypot(this.startX - this.x, this.startY - this.y);

                if (this.distanceTraveled >= this.distanceToTarget) {
                    createParticles(this.targetX, this.targetY, this.hue, this.shapeId, this.scale);
                    playExplosionSound(this.scale);
                    fireworks.splice(index, 1);
                } else {
                    this.x += vx;
                    this.y += vy;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.hue}, 100%, ${this.brightness}%)`;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, hue, offsetX, offsetY, scale) {
                this.x = x;
                this.y = y;
                this.coordinates = [];
                this.coordinateCount = 5;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                
                const speedMod = (Math.random() * 0.3 + 0.85) * scale;
                this.vx = offsetX * speedMod * 0.12;
                this.vy = offsetY * speedMod * 0.12;
                
                this.vx += (Math.random() - 0.5) * 0.6;
                this.vy += (Math.random() - 0.5) * 0.6;

                this.friction = 0.94;
                this.gravity = 0.22;
                this.hue = hue + Math.random() * 30 - 15;
                this.brightness = Math.random() * 50 + 50;
                this.alpha = 1;
                // 큰 불꽃은 좀 더 오래 남고, 작은 불꽃은 빠르게 사라짐
                this.decay = (Math.random() * 0.01 + 0.008) / Math.sqrt(scale);
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;

                if (this.alpha <= this.decay) {
                    particles.splice(index, 1);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
                ctx.stroke();
            }
        }

        function createParticles(x, y, hue, shapeId, scale) {
            const generator = shapeGenerators[shapeId % shapeGenerators.length];
            const shapePoints = generator(Math.random() * Math.PI, 100);

            shapePoints.forEach(pt => {
                particles.push(new Particle(x, y, hue, pt.x, pt.y, scale));
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let i = fireworks.length;
            while (i--) {
                fireworks[i].draw();
                fireworks[i].update(i);
            }

            let j = particles.length;
            while (j--) {
                particles[j].draw();
                particles[j].update(j);
            }
        }

        // 마우스 클릭 시 3~5발 동시 발사
        window.addEventListener('click', (e) => {
            if (e.clientY < 90 && e.clientX < 300) return;

            initAudio();

            const fireworkCount = Math.floor(Math.random() * 3) + 3; // 3, 4, 5발

            for (let i = 0; i < fireworkCount; i++) {
                shapeIndex = (shapeIndex + 1) % 100;
                
                const offsetX = (Math.random() - 0.5) * 180;
                const offsetY = (Math.random() - 0.5) * 120;
                
                const startX = canvas.width / 2 + (Math.random() - 0.5) * 250;
                const startY = canvas.height;
                const targetX = Math.max(60, Math.min(canvas.width - 60, e.clientX + offsetX));
                const targetY = Math.max(60, Math.min(canvas.height - 120, e.clientY + offsetY));

                fireworks.push(new Firework(startX, startY, targetX, targetY, shapeIndex));
            }

            shapeCounter.innerText = `현재 발사된 불꽃: ${fireworkCount}발 멀티 연출 (3단계 크기 적용)`;
        });

        animate();
    </script>
</body>
</html>
